<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="flaskStroke" x1="20" y1="15" x2="80" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="flaskGrad" x1="20" y1="85" x2="80" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#22d3ee" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Flask Outer Shell (Code Brackets Style) -->
  <path d="M 40 14 L 60 14 M 44 14 L 44 32 L 20 74 C 16 81 21 87 29 87 L 71 87 C 79 87 84 81 80 74 L 56 32 L 56 14"
        stroke="url(#flaskStroke)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Liquid Surface & Body -->
  <path d="M 27 74 L 35 60 C 43 56 57 64 65 60 L 73 74 C 76 79 73 83 68 83 L 32 83 C 27 83 24 79 27 74 Z"
        fill="url(#flaskGrad)" stroke="#10b981" stroke-width="2.5" />

  <!-- Inner Python Dynamic Wave Streams -->
  <path d="M 37 76 Q 50 63 63 76" stroke="#34d399" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 39 65 Q 50 52 61 65" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Rising AI Token Sparkles -->
  <circle cx="50" cy="46" r="3.2" fill="#22d3ee" filter="url(#aiGlow)" />
  <circle cx="43" cy="36" r="2.6" fill="#34d399" />
  <circle cx="57" cy="27" r="2.2" fill="#ffffff" />

  <!-- Top AI Prompt Emission Star -->
  <path d="M 50 3 L 52.5 9.5 L 59 12 L 52.5 14.5 L 50 21 L 47.5 14.5 L 41 12 L 47.5 9.5 Z" fill="#22d3ee" filter="url(#aiGlow)" />
</svg>
