[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-ai-lab"
version = "0.1.0"
description = "Interactive curriculum and production reference implementations for modern Python AI & web architectures."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Python AI Lab Contributors" }
]
keywords = ["python", "ai", "sveltekit", "litestar", "flask", "pydantic", "rag", "agents", "openai", "pytest"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Framework :: Flask",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "flask>=3.1.3",
    "litestar>=2.24.0",
    "openai>=3.35.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "tenacity>=9.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.0",
    "pytest-mock>=3.17.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.25.0",
    "beautifulsoup4>=4.13.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-mock>=3.17.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.25.0",
    "beautifulsoup4>=4.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/lib/data/code-snippets"]
addopts = "-v --cov-report=term-missing"

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*__pycache__*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
